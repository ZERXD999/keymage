# Render Blueprint — กด "New + → Blueprint" แล้วเลือก repo นี้ ระบบจะตั้งค่าให้เอง
services:
  - type: web
    name: keymage
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TRUST_PROXY
        value: "1"
